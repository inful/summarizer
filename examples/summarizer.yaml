# summarizer config — copy to ./summarizer.yaml and edit.
#
# CLI flags override anything here. Secrets (GitLab PAT, LLM API keys) come
# from env vars, never this file.

# Required: GitLab base URL. For gitlab.com use "https://gitlab.com".
gitlab_host: "https://gitlab.example.com"

# Output directory for the two reports (one per audience).
output_dir: "./summarizer-out"


# LLM provider and model. Per-audience override is not yet supported;
# one model drives both reports. CLI flag overrides.
provider: "openai"
model: "gpt-4o-mini"

# Hard cap on events sent to the LLM. Excess (oldest) is dropped and the
# truncation is disclosed in the report's prompt. Tune for your busiest
# project's typical weekly volume.
max_events: 200

# OpenAI-compatible base URL. Default points at api.openai.com. For local
# servers, set to e.g. "http://localhost:11434/v1" (Ollama),
# "http://localhost:1234/v1" (LM Studio), or "http://localhost:8000/v1"
# (vLLM). Either bare host or /v1-suffixed forms are accepted. The
# $OPENAI_BASE_URL env var and --openai-base-url CLI flag override.
#
# When this points anywhere other than api.openai.com, OPENAI_API_KEY is
# treated as optional — most local servers ignore the Authorization
# header entirely.
# openai_base_url: "https://api.openai.com/v1"
# openai_base_url: "http://localhost:11434/v1"  # Ollama

# Multi-project runs. When more than one project is listed, summarizer
# writes a combined rollup (combined--<duration>d--customer.md and
# --team.md) by feeding the per-project reports to one extra LLM call
# per audience. Per-project reports stay the same.
#
# There is no `projects:` list here on purpose. The project set comes
# from the CLI: with no discovery flag, summarizer runs every project
# the token can see that had activity in the window. --project
# (repeatable, comma-separated), --discover-group and
# --discover-by-topic narrow or redirect that. A config-file project
# list would be a second way to say the same thing that nothing reads.

# Optional: publish to a GitLab project as MRs for review instead of
# writing Markdown locally. Reports are committed per-period on a branch
# named "<source_branch_prefix>/<period>" (default: summarizer/2026-10-19)
# and opened as a single MR against <default_branch>. Re-runs for the
# same period accumulate commits on the existing MR.
#
# When enabled, the local disk writer is skipped — every report file
# lives only in the GitLab target until a human merges the MR.
#
# `token_env` points to the env var that holds a PAT with api scope on
# the target project. Defaults to GITLAB_REPORTS_TOKEN. Use a *separate*
# PAT from the source-fetch one (`GITLAB_TOKEN`) so the operator's read
# scope and the publishing identity can be revoked independently.
#
# publish:
#   enabled: true
#   host: "https://gitlab.example.com"  # default = same as gitlab_host above
#   token_env: "GITLAB_REPORTS_TOKEN"
#   project: "group/reports"
#   prefix: "reports"                    # repo path; "" = repo root
#   default_branch: "main"
#   source_branch_prefix: "summarizer"

# Optional: gate every LLM call behind a prompt-injection detector.
# When enabled, the rendered prompt is sent to a decision API (your own
# `inful/decide`, a Go client for /v1/systemone) before each LLM call.
# A noul probability >= injection_threshold means injection = hard-
# fail the run with exit non-zero. Default OFF.
#
# The check protects against the legitimate concern that a GitLab MR
# title/description designed to manipulate the model can sneak past
# the <data> markers when combined with clever framing. Decision models
# are tuned for routing, not generation, so they're a cheap second pair
# of eyes per generation.
#
# safety:
#   enabled: true
#   decision_url: "https://api.example.com"
#   decision_token_env: "SAFETY_DECISION_TOKEN"  # default
#   injection_threshold: 0.7                       # default