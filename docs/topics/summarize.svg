<?xml version="1.0" encoding="UTF-8"?>
<!--
  summarize topic avatar
  =====================
  Upload to Project > Settings > Topics for any project that should run
  through summarizer. Sized for GitLab's 64x64 avatar slot; SVG scales
  without loss to 16x16 (favicon) and 128x128 (large avatar).

  Visual language: a document with a bold summary bar across the top —
  the focal element — over three fainter lines that represent the data
  being summarised. The blue background panel is the inful-mark colour
  at low saturation so the icon reads as a category tag on any surface
  (light gray chip, dark mode, project sidebar).

  Pair of docs/topics/summarize-team-only.svg. Same shape, same palette,
  same proportions — the only difference is the lock badge, so the two
  icons read as a matched set at any size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="summarize topic avatar">
  <title>summarize topic avatar</title>
  <!-- background panel: light blue, rounded square -->
  <rect width="64" height="64" rx="12" fill="#dbeafe"/>
  <!-- document body with folded top-right corner -->
  <path d="M16 10 H42 L50 18 V54 H16 Z" fill="#ffffff" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <!-- folded corner detail -->
  <path d="M42 10 V18 H50" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <!-- summary bar: top, bold, the focal element -->
  <rect x="22" y="22" width="20" height="5" rx="1" fill="#2563eb"/>
  <!-- data lines below: the source being summarised -->
  <line x1="22" y1="34" x2="44" y2="34" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="42" x2="40" y2="42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="36" y2="50" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
