# yaml-language-server: $schema=https://lefthook.dev/schema.json
#
# ─── Canonical consumer lefthook.yml ───────────────────────────────────────
# Centralized config imported from github.com/inful/lefthooks@v0.5.0.
# Shared hooks include gofmt, go vet, golangci-lint, go test -race,
# govulncheck, markdownlint, docbuilder-lint, conventional-commit checks,
# trailing-whitespace / merge-conflict / large-file guards, and more —
# each self-gated by glob + skip conditions so they only fire when the
# project's shape permits.
#
# See https://github.com/inful/lefthooks for the full hook inventory.
#
# To reproduce locally: `lefthook install`. Hooks then run automatically
# on every `git commit` (pre-commit), `git commit -m "..."` (commit-msg),
# and `git push` (pre-push).
#
# CI covers only the Go suite: go vet, golangci-lint, go test -race and
# govulncheck. The DOCUMENT hooks — markdownlint, docbuilder-lint, typos,
# gitleaks, shellcheck, actionlint, hadolint — run on the author's
# machine and nowhere else, so a contributor without lefthook installed
# gets none of them. Two of those need care:
#
#   • docbuilder-lint validates docs/frontmatter-schema.md, the contract
#     for the frontmatter every published file carries. It SKIPS SILENTLY
#     when the `docbuilder` binary is missing or broken, which a bare
#     mise shim with no pinned version is — so "✔️ docbuilder-lint" can
#     mean "never ran". Check `docbuilder --version` yourself.
#   • markdownlint and typos likewise need their binaries on PATH.
#
# Adding them to .github/workflows/ci.yml needs their install steps
# pinned first; they are plain CLI tools, not something CI has today.

min_version: 2.1.0

remotes:
  - git_url: https://github.com/inful/lefthooks.git
    ref: v0.5.0
    configs:
      - lefthook.yml
